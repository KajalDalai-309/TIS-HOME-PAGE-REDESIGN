<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulas International School | Best Boarding School in Dehradun</title>
    <meta name="description" content="Tulas International School (TIS) is one of India's top CBSE boarding and day schools in Dehradun. Admissions open for Class IV to XII." />
    <meta name="theme-color" content="#b90124" />
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint so dark-mode users never see a light flash.
      (function () {
        try {
          var saved = localStorage.getItem('tis-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
